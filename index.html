<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS</title>
    <link rel="stylesheet" href="output.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-lg mx-auto flex flex-col rounded-lg border-2 border-black overflow-hidden bg-white shadow-lg">
        
        <!-- Quote Container -->
        <div class="w-full bg-gradient-to-r from-sky-500 to-indigo-500 text-white h-24 flex justify-center items-center font-bold text-xl">
            News You Can Trust
        </div>
        
        <!-- Content Container -->
        <div class="text-center mt-6 w-full px-8">
            <h3 class="text-lg font-semibold">Stay up to date with the latest!</h3>
            <p class="text-gray-600 mt-2">Subscribe to our newsletter for the latest news straight into your inbox.</p>
            
            <form class="flex flex-col gap-4 mt-6 mb-4">
                <input 
                    type="email" 
                    placeholder="your@email.com" 
                    class="w-full bg-slate-200 text-center placeholder:text-sm py-3 rounded outline-none focus:ring-2 focus:ring-blue-500"
                    required
                >
                <button 
                    type="submit" 
                    class="bg-blue-500 hover:bg-blue-600 transition-colors w-full text-white py-3 rounded-full font-medium"
                >
                    Subscribe Now
                </button>
            </form>
            
            <p class="my-6 text-sm text-gray-400">We Value Your Privacy</p>
        </div>
    </div>
</body>
